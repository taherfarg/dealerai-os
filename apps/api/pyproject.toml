[project]
name = "dealerai"
version = "0.0.0"
description = "DealerAI OS API and agent worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "cryptography>=50.0.1",
    "pyjwt>=2.13.0",
    "google-genai>=2.22.0",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "playwright>=1.62.0",
    # zoneinfo has no IANA database on Windows, and response targets are computed
    # in the tenant's timezone. Data, not code.
    "tzdata>=2026.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dealerai"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "google.genai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Evals hit the real API and cost money; opt in with `npm run eval`.
addopts = "-m 'not eval'"
markers = ["eval: requires ANTHROPIC_API_KEY and spends money"]
