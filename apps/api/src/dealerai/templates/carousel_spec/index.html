<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../_tokens.css">
<link rel="stylesheet" href="../_base.css">
<style>
.index { position: absolute; inset-block-start: var(--safe);
          inset-inline-end: var(--safe); padding: 0.3em 0.7em; border-radius: 999px;
          background: rgb(0 0 0 / 45%); color: #fff; font-size: 0.8em;
          font-weight: 600; unicode-bidi: plaintext; }
</style>
</head>
<body dir="{{dir}}">
<div class="frame">
<div class="photo" style="background-image:url({{photo_url}})"></div>
    <div class="scrim"></div>
    <img class="logo" src="{{logo_url}}" alt="">
    <span class="index">{{index}}</span>
    <div class="stack safe">
      <h1 class="headline">{{headline}}</h1>
      <p class="sub">{{subhead}}</p>
    </div>
    <p class="disclaimer">{{disclaimer}}</p>
</div>
</body>
</html>
