<!doctype html>
<!-- What the service worker shows when a page load finds no network
     (public/sw.js). Static, with no script and nothing fetched: it has to
     work with nothing but itself. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DealerAI — offline</title>
    <style>
      body {
        margin: 0;
      }
      main {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1.5rem;
        box-sizing: border-box;
        font-family: system-ui, sans-serif;
        text-align: center;
        background: #0a2540;
        color: #fff;
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
      }
      p {
        margin: 0;
        max-width: 28rem;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem;
        padding: 0 1.25rem;
        border-radius: 0.375rem;
        background: #fff;
        color: #0a2540;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>DealerAI</h1>
      <p>You are offline. DealerAI needs a connection to show your customers.</p>
      <p lang="ar" dir="rtl">أنت غير متصل بالإنترنت. يحتاج DealerAI إلى اتصال لعرض عملائك.</p>
      <a href="/">Try again · <span lang="ar">حاول مرة أخرى</span></a>
    </main>
  </body>
</html>
