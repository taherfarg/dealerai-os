# Local development only. Staging and production run on Supabase.
# Postgres 17 to match the Supabase project — testing on a different major
# version than production is how you find out about a behaviour change at the
# worst possible moment.
# Port 54332, not the Supabase CLI default 54322: a Supabase stack for another
# project may already hold that port, and two projects fighting over it is a
# 20-minute debugging session nobody needs.
# DB_PORT moves it: Windows sometimes reserves the range that holds 54332 after
# a restart (netsh interface ipv4 show excludedportrange protocol=tcp). Set
# DB_PORT in .env and use the same port in its two database URLs.

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dealerai
    ports:
      - "${DB_PORT:-54332}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dealerai"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db_data:
