# Local development only. Staging and production run on Supabase.
# Port 54332, not the Supabase CLI default 54322: a Supabase stack for another
# project may already hold that port, and two projects fighting over it is a
# 20-minute debugging session nobody needs.

services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dealerai
    ports:
      - "54332:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dealerai"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db_data:
