name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest

    services:
      db:
        # The major version the local container and the Supabase project run.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dealerai
        ports:
          - 54332:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dealerai"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      ENV: local
      LOG_LEVEL: warning
      DATABASE_URL: postgresql://dealerai_app:dealerai_app@localhost:54332/dealerai
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:54332/dealerai
      GOOGLE_API_KEY: ""
      SUPABASE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      DB_POOL_MIN: 1
      DB_POOL_MAX: 5

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        working-directory: apps/api
        run: uv sync --all-extras --dev

      # The compositor renders with a real browser, so the creative tests need
      # one. --with-deps because a bare runner has none of the shared libraries
      # Chromium links against, and the failure is a linker error rather than
      # anything that names a browser.
      - name: Install Chromium
        working-directory: apps/api
        run: uv run playwright install --with-deps chromium

      - name: Lint
        working-directory: apps/api
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        working-directory: apps/api
        run: uv run mypy src

      # Runs from empty every time, so a migration that only works on an
      # already-populated database fails here rather than in production.
      - name: Migrate from empty
        working-directory: apps/api
        run: uv run python -m dealerai.scripts.migrate

      - name: Test
        working-directory: apps/api
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Placeholders: the build only needs these to be present and well-formed.
      # Nothing in CI talks to the real project.
      - name: Check web
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: |
          npm run typecheck
          npm run check:rtl
          npm run lint
          npm run test
          npm run build

  # The web app's types are generated from the API's OpenAPI document. A route or
  # model that changed without regenerating apps/web/lib/api is drift, and drift
  # is how a field quietly disappears from a screen. Exporting the schema needs no
  # database: nothing connects at import time.
  contract:
    runs-on: ubuntu-latest
    env:
      ENV: local
      LOG_LEVEL: warning
      DATABASE_URL: postgresql://dealerai_app:dealerai_app@localhost:54332/dealerai
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:54332/dealerai
      GOOGLE_API_KEY: ""
      SUPABASE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install API
        working-directory: apps/api
        run: uv sync --all-extras --dev

      - name: Generated API types are current
        run: npm run check:openapi

  # The paths every slice ended on, walked by a browser against the real API,
  # the worker and a seeded database (docs/sales/07-frontend.md § 11). The
  # stack's settings are in apps/web/e2e/stack.ts, not here, so a laptop and CI
  # run the same thing.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dealerai
        ports:
          - 54332:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dealerai"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install API
        working-directory: apps/api
        run: uv sync --all-extras --dev

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: End to end
        run: npm run e2e

      # What the browser saw, step by step, for a failure nobody can reproduce.
      # The workspace in it is the seed's: no real customer is in a trace.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
